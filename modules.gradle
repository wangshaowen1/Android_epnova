/**
 * 快歌公共模块Maven仓库版本
 */
ext {
    modules = [
            baselibrary: [
                    groupId   : 'com.kuaige',
                    artifactId: 'baselibrary',
                    version   : '1.1.5',
                    gav       : 'com.kuaige:baselibrary:1.1.5'
            ],
            imageloader: [
                    groupId   : 'com.kuaige',
                    artifactId: 'imageloader',
                    version   : '1.0.6',
