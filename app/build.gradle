void genProguardDict() {
    def file = file('proguard-dict.txt')
    if (file.exists()) {
        file.delete()
    }
    def r = new Random()
    def firstChars = ["o", "O"]
    def chars = ["o", "O", "0", "Ò", "Ó", "Ô", "Õ", "Ö"]
    int firstSize = firstChars.size()
    int size = chars.size()
    def dict = []
    for (int length = 10; length <= 30; length++) {
        for (int firstIndex = 0; firstIndex < 10; firstIndex++) {
            def word = firstChars.get(r.nextInt(firstSize))
            for (int appendLength = 1; appendLength <= length; appendLength++) {
                word += chars.get(r.nextInt(size))
            }
            dict.add(word)
        }
    }
    // 打乱顺序
    Collections.shuffle(dict, r)
    file.write(dict.join(System.lineSeparator()))
    println('genProguardDict')
}

genProguardDict()
android {
    compileSdk rootProject.ext.android.compileSdkVersion

    defaultConfig {
        applicationId rootProject.ext.android.applicationId
        minSdkVersion rootProject.ext.android.minSdkVersion
        targetSdkVersion rootProject.ext.android.targetSdkVersion
        versionName rootProject.ext.android.versionName
        versionCode rootProject.ext.android.versionCodeRelease
        multiDexEnabled true
        buildConfigField "long", "BUILD_TIMESTAMP", System.currentTimeMillis() + "L"
        //指定room.schemaLocation生成的文件路径
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        packagingOptions {
            doNotStrip "*/armeabi-v7a/*.so"
            doNotStrip "*/x86/*.so"
            doNotStrip "*/arm64-v8a/*.so"
            doNotStrip "*/x86_64/*.so"
            doNotStrip "armeabi.so"
        }

        bundle {
            language {
                enableSplit = false
            }
            density {
                enableSplit = true
            }
            abi {
                enableSplit = true
            }
        }
    }

    signingConfigs {
        debug {
            keyAlias 'epnova'
            keyPassword '111111'
            storeFile file("../com.kuaigeglobal.epnova.jks")
            storePassword '111111'
        }
        release {
            keyAlias 'epnova'
            keyPassword '111111'
            storeFile file("../com.kuaigeglobal.epnova.jks")
            storePassword '111111'
        }
    }

    dataBinding {
        enabled = true
    }

    buildFeatures {
        viewBinding = true
        buildConfig true
    }


    buildTypes {
        release {
            ndk {
                //app/build/intermediates/symbol_list/release/native-debug-symbols.zip     上传到Google Play Console的下载里面（用于 native 崩溃分析）
                debugSymbolLevel 'FULL'
            }

            minifyEnabled true
            //版本号
            buildConfigField "String", "APP_VERSION", '"' + rootProject.ext.android.versionCodeRelease + '"'
            //Zipalign优化
            zipAlignEnabled true
            //移除无用的resource文件
            shrinkResources true
            signingConfig signingConfigs.release
            //网络请求地址
            buildConfigField "boolean", "DEBUG_MODEL", "false" //是否是debug哦是


            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
        }

        debug {
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
            minifyEnabled false
            jniDebuggable false
            //版本号
            buildConfigField "String", "APP_VERSION", '"' + rootProject.ext.android.versionCodeDebug + '"'
            //Zipalign优化 , m,
            zipAlignEnabled false
            //移除无用的resource文件
            shrinkResources false

            buildConfigField "boolean", "DEBUG_MODEL", "true" //是否是debug模式

            versionNameSuffix ""
            signingConfig signingConfigs.debug

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }


        /**
         * 打包或运行时再注入版本号
         */
        applicationVariants.all { variant ->
            def buildType = variant.buildType.name
            def createTime = new Date().format("yyyyMMdd_HHmmss", TimeZone.getTimeZone("GMT+08:00"))
            if (buildType == "release") {
                //variant.getPackageApplicationProvider().get().outputDirectory = new File(project.rootDir.absolutePath + "/apks/release/${createTime}")
            }

            variant.outputs.each { output ->
                output.versionCodeOverride = rootProject.ext.android.versionCodeRelease
            }

            variant.outputs.all { output ->
                def name = (project.name != "app") ? project.name : rootProject.name
                outputFileName = name + "_" +
                        variant.versionName + "_" + //版本号
                        variant.flavorName + (variant.flavorName.endsWith("_") ? "" : "_") + //渠道名
                        createTime + "_" +
                        buildType +
                        ".apk"
            }
        }
    }


    kotlinOptions {
        jvmTarget = '17'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['lib/x86/libc++_shared.so', 'lib/x86_64/libc++_shared.so', 'lib/arm64-v8a/libc++_shared.so', 'lib/armeabi-v7a/libc++_shared.so']
        }
        resources {
            merges += ['META-INF/proguard/androidx-annotations.pro', 'META-INF/proguard/coroutines.pro']
        }
    }
    flavorDimensions = ['env', 'arch']
    productFlavors {
        //开发测试环境
        develop {
            dimension 'env'
            buildConfigField 'String', 'SERVER_URL', '"https://epnova-test.kwaige.cn"'
        }
        //预发布
        preview {
            dimension 'env'
            buildConfigField 'String', 'SERVER_URL', '"http://120.24.240.28:9010"'
        }
        //生产环境
        production {
            dimension 'env'
            buildConfigField 'String', 'SERVER_URL', '"https://api.epnovai.com"'
        }
        arch32 {
            dimension 'arch'
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
        arch64 {
            dimension 'arch'
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }
    namespace 'com.kuaigeglobal.epnova'
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
